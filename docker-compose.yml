version: '3.8'

services:
  # --- HẠ TẦNG DỮ LIỆU ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      # Cổng 9092 được mở ra để script chạy bên ngoài có thể kết nối vào
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mariadb:
    image: mariadb:10.6
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=myrootpassword
      - MARIADB_DATABASE=iot_data
      - MARIADB_USER=myuser
      - MARIADB_PASSWORD=mypassword
    ports:
      - "3300:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  
  hivemq:
    image: hivemq/hivemq-ce:latest # Community Edition
    restart: always
    ports:
      - "1883:1883" # Cổng MQTT chính
      - "8080:8080" # Giao diện quản lý
      - "8883:8883" # Cổng MQTT qua WebSockets (cho dashboard)
      
  # --- CÁC MICROSERVICES BÊN TRONG DOCKER ---
  database_worker:
    build: ./services/database_worker
    restart: always
    depends_on:
      - mariadb
      - kafka
  
  storage_worker:
    build: ./services/storage_worker
    restart: always
    depends_on:
      - minio
      - kafka

volumes:
  mariadb-data:
  minio-data: