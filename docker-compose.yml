services:
  # -------------------------------------------
  # ---      TẦNG HẠ TẦNG DỮ LIỆU         ---
  # -------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: myrootpassword
      MARIADB_DATABASE: iot_data
      MARIADB_USER: myuser
      MARIADB_PASSWORD: mypassword
    ports:
      - "3300:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  
  hivemq:
    image: hivemq/hivemq-ce:latest
    container_name: hivemq
    restart: always
    ports:
      - "1883:1883"
      - "8080:8080"
      - "8883:8883"
      - "9002:9002" # WebSocket cho dashboard
    volumes:
    - ./hivemq-config/config.xml:/opt/hivemq/conf/config.xml
    environment:
    - HIVEMQ_ALLOW_ALL_CLIENTS=true # Cho phép tất cả các client kết nối (chỉ dùng trong môi trường phát triển)

  # -------------------------------------------
  # ---      TẦNG ỨNG DỤNG & DỊCH VỤ        ---
  # -------------------------------------------
  database_worker:
    build: ./services/database_worker
    container_name: database_worker
    restart: always
    depends_on:
      - mariadb
      - kafka

  storage_worker:
    build: ./services/storage_worker
    container_name: storage_worker
    restart: always
    depends_on:
      - minio
      - kafka
  
  ai_worker:
    build: ./services/ai_worker
    container_name: ai_worker
    restart: always
    depends_on:
      - kafka
    volumes:
      - ./models:/models:ro # :ro nghĩa là chỉ đọc (read-only)

  api_server:
    build: ./services/api_server
    container_name: api_server
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8000:8000"

  mqtt_bridge:
    build: ./services/mqtt_bridge
    container_name: mqtt_bridge
    restart: always
    depends_on:
      - kafka
      - hivemq

# Định nghĩa các volume để lưu trữ dữ liệu bền bỉ
volumes:
  mariadb-data:
  minio-data:
